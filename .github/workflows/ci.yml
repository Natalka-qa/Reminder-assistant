name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reminder_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/reminder_ci
      AUTH_SECRET: ci-placeholder-secret
      AUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-placeholder-id
      GOOGLE_CLIENT_SECRET: ci-placeholder-secret
      RESEND_API_KEY: ci-placeholder-key
      EMAIL_FROM: onboarding@resend.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply migrations to a clean database
        run: npx prisma migrate deploy

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run format:check

      - run: npm run test

      - run: npm run build
